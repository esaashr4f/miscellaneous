<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>Langtitles</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#f05a0e"/>
    </linearGradient>
    <linearGradient id="fur2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <polygon points="10,4 40,26 20,46" fill="#e5500a"/>
  <polygon points="86,4 56,26 76,46" fill="#c9450a"/>
  <polygon points="15,13 33,27 22,40" fill="#2a1a14"/>
  <polygon points="81,13 63,27 74,40" fill="#2a1a14"/>
  <!-- head, low-poly facets -->
  <polygon points="20,30 48,22 76,30 84,46 48,56 12,46" fill="url(#fur)"/>
  <polygon points="20,30 48,22 48,52" fill="url(#fur2)"/>
  <polygon points="76,30 48,22 48,52" fill="#ff8a2a"/>
  <polygon points="12,46 48,56 34,62" fill="#e8620f"/>
  <polygon points="84,46 48,56 62,62" fill="#d4560c"/>
  <!-- white cheeks and muzzle -->
  <polygon points="12,46 34,60 48,90 24,70" fill="#fff6ee"/>
  <polygon points="84,46 62,60 48,90 72,70" fill="#f1e4d8"/>
  <polygon points="34,60 48,56 62,60 48,90" fill="#ffffff"/>
  <!-- eyes -->
  <polygon points="27,45 39,41 41,48 31,50" fill="#1d1f25"/>
  <polygon points="69,45 57,41 55,48 65,50" fill="#1d1f25"/>
  <circle cx="37" cy="44.5" r="1.4" fill="#ffffff"/>
  <circle cx="59" cy="44.5" r="1.4" fill="#ffffff"/>
  <!-- nose -->
  <polygon points="43,80 53,80 48,88" fill="#1d1f25"/>
</svg>
